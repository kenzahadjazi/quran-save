<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق حفظ القرآن الكريم - من النهاية للبداية</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --primary-color: #4CAF50;
            --success-color: #2e7d32;
            --border-color: #e0e0e0;
        }
        body {
            font-family: Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 5px;
            font-size: 22px;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .group-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            border: 1px solid var(--border-color);
            padding: 12px 18px;
            margin-bottom: 10px;
            border-radius: 8px;
            transition: transform 0.2s;
        }
        .group-item:hover {
            border-color: var(--primary-color);
            transform: translateX(-3px);
        }
        .group-link {
            text-decoration: none;
            color: var(--text-color);
            font-weight: bold;
            font-size: 16px;
        }
        .group-link:hover {
            color: var(--primary-color);
        }
        .check-btn {
            background-color: #e8f5e9;
            color: var(--success-color);
            border: 2px solid var(--success-color);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
        }
        .check-btn:hover {
            background-color: var(--success-color);
            color: white;
        }
        .stats {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            color: #e67e22;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>حفظ القرآن (من أواخر سور القرآن صعوداً)</h1>
        <p class="subtitle">اضغط على ✓ عند الحفظ لتختفي المجموعة وتظهر التي تليها</p>
        
        <div id="activeList"></div>
        <div class="stats" id="statsText"></div>
    </div>

    <script>
        const totalGroups = 1549;
        const displayCount = 5;

        function renderActiveGroups() {
            const listContainer = document.getElementById('activeList');
            const statsText = document.getElementById('statsText');
            let html = '';
            
            let displayed = 0;
            let currentGroup = 1; 

            while (currentGroup <= totalGroups && displayed < displayCount) {
                const isSaved = localStorage.getItem('group_' + currentGroup) === 'true';
                
                if (!isSaved) {
                    html += `
                        <div class="group-item">
                            <a href="group_${currentGroup}.html" class="group-link">مجموعة ${currentGroup}</a>
                            <button class="check-btn" onclick="markAsSaved(${currentGroup})">✓ تم الحفظ</button>
                        </div>
                    `;
                    displayed++;
                }
                currentGroup++;
            }

            if (displayed === 0) {
                listContainer.innerHTML = '<p style="text-align:center; color:green; font-weight:bold;">🎉 ما شاء الله! لقد أتممت حفظ جميع مجموعات القرآن الكريم بنجاح!</p>';
            } else {
                listContainer.innerHTML = html;
            }

            let savedCount = 0;
            for (let i = 1; i <= totalGroups; i++) {
                if (localStorage.getItem('group_' + i) === 'true') savedCount++;
            }
            statsText.innerText = `المجموعات المحفوظة: ${savedCount} من ${totalGroups}`;
        }

        function markAsSaved(groupNum) {
            localStorage.setItem('group_' + groupNum, 'true');
            renderActiveGroups();
        }

        renderActiveGroups();
    </script>

</body>
</html>
